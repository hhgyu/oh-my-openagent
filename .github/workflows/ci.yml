name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3]
        fixture: [bun, sync]
    steps:
      - uses: actions/checkout@v7
      - name: Keep temp files off the OS volume
        shell: pwsh
        run: .github/scripts/windows-test-temp.ps1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - name: Share Bun's transpiler cache with test children
        shell: bash
        run: echo "BUN_RUNTIME_TRANSPILER_CACHE_PATH=$RUNNER_TEMP/bun-transpiler-cache" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun run script/remove-stale-self-package-tests.ts
      - name: real shard-1 with instrumented task_update
        shell: pwsh
        run: |
          fltmc filters
          fltmc instances -v C:
          fltmc instances -v D:
          Get-Service WSearch, SysMain -ErrorAction SilentlyContinue | Format-Table Name, Status | Out-String
          $env:DIAG_FIXTURE_WRITE = "${{ matrix.fixture }}"
          $dir = Join-Path $env:RUNNER_TEMP "shard1"
          bun script/ci-windows-shard-1.ts $dir *> (Join-Path $env:RUNNER_TEMP "shard1-console.log")
          Select-String -Path (Join-Path $dir "omo-opencode.log") -Pattern 'DIAG_RESULT|DIAG_HOLD|\(fail\)' | ForEach-Object Line
          Get-ChildItem $dir | Select-Object Name,Length | Format-Table | Out-String
