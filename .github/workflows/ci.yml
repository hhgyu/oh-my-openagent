name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: task-update on C and D temp, isolated, 40x each
        shell: pwsh
        run: |
          fsutil 8dot3name query C: ; fsutil 8dot3name query D:
          foreach ($drive in @("C", "D")) {
            $t = if ($drive -eq "C") { $env:TEMP } else { Join-Path $env:RUNNER_TEMP "test-tmp" }
            New-Item -ItemType Directory -Force $t | Out-Null
            $env:TEMP = $env:TMP = $env:TMPDIR = $t
            $fails = 0
            foreach ($i in 1..40) {
              $o = bun test --timeout 30000 packages/omo-opencode/src/tools/task 2>&1 | Out-String
              if ($o -match ' (\d+) fail' -and $Matches[1] -ne '0') { $fails++; ($o -split "`n" | Select-String 'DIAG_RESULT|\(fail\)') -join "`n" }
            }
            "drive $drive temp $t: $fails/40 runs with failures"
          }
      - name: windows-path-identity on D temp
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP "test-tmp3"; New-Item -ItemType Directory -Force $t | Out-Null
          $env:TEMP = $env:TMP = $env:TMPDIR = $t
          bun test --timeout 30000 packages/omo-opencode/src/hooks/prometheus-md-only/windows-path-identity.test.ts

      - name: full omo-opencode once on D temp
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP "test-tmp2"; New-Item -ItemType Directory -Force $t | Out-Null
          $env:TEMP = $env:TMP = $env:TMPDIR = $t
          bun test --timeout 30000 packages/omo-opencode 2>&1 | Select-String 'DIAG_RESULT|\(fail\)| pass$| fail$'
